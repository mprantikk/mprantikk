<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 134 46" width="134" height="46" role="img" aria-label="LinkedIn" xmlns:c2pa="http://c2pa.org/manifest"><title>LinkedIn</title><style>
@keyframes up{from{transform:translateY(150px)}to{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{r:5;opacity:.9}100%{r:15;opacity:0}}
.up{animation:up 1s cubic-bezier(.2,.8,.2,1) both}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
.tw{animation:tw 3.4s ease-in-out infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .7s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
