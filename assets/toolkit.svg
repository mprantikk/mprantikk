<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 534" width="1000" height="534" role="img" aria-label="Toolkit: Power BI, DAX, Tableau, Metabase, Excel VBA, PostgreSQL, SQL Server, Snowflake, Python, Retool, Notion, Linear, data governance and team leadership." xmlns:c2pa="http://c2pa.org/manifest"><title>Toolkit: Power BI, DAX, Tableau, Metabase, Excel VBA, PostgreSQL, SQL Server, Snowflake, Python, Retool, Notion, Linear, data governance and team leadership.</title><style>
@keyframes up{from{transform:translateY(150px)}to{transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.55) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
